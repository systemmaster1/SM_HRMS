<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SM HRMS – Offline</title>
<style>
  :root { --bg:#F4F7FB; --card:#fff; --text:#0F172A; --muted:#64748B; --brand:#163F86; --line:#E2E8F0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0B1220; --card:#111A2E; --text:#F1F5F9; --muted:#94A3B8; --line:#1E293B; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family: -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif; padding:24px; }
  .card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px; text-align:center; }
  .icon { width:56px; height:56px; margin:0 auto; border-radius:16px; display:grid; place-items:center; background:rgba(22,63,134,.1); color:var(--brand); }
  h1 { font-size:18px; margin:16px 0 6px; }
  p { font-size:14px; line-height:1.5; color:var(--muted); margin:0; }
  button { margin-top:22px; width:100%; border:0; border-radius:12px; padding:13px; font-size:15px; font-weight:600; color:#fff; background:var(--brand); }
  small { display:block; margin-top:12px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M19 12.9a10 10 0 0 0-2.3-1.7"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M22 8.8a15 15 0 0 0-11.3-3.7"/><path d="m2 2 20 20"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>SM HRMS needs an internet connection. Check your mobile data or Wi-Fi.</p>
    <button id="retry">Try again</button>
    <small id="hint">We'll reconnect automatically when you're back online.</small>
  </div>
<script>
  var target = new URLSearchParams(location.search).get("u") || "";
  function retry() {
    document.getElementById("retry").textContent = "Connecting…";
    if (target && /^https:\/\//.test(target)) location.replace(target); else history.back();
  }
  document.getElementById("retry").addEventListener("click", retry);
  window.addEventListener("online", retry);
</script>
</body>
</html>
