name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Ensure Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build installable APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk SM-HRMS.apk
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" SM-HRMS.apk \
            --title "SM HRMS Android ${GITHUB_RUN_NUMBER}" \
            --notes "Direct-install Android build for SM HRMS." \
            --latest
      - uses: actions/upload-artifact@v4
        with:
          name: SM-HRMS-APK
          path: SM-HRMS.apk
