name: Build Android APK + Play Store AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sm-hrms-android-build
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK environment variable is not set."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            echo "Available SDK directories:"
            find "$SDK_ROOT" -maxdepth 3 -type d | head -n 100
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Android SDK 36
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

          echo "Installed Android packages:"
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-36|build-tools;36.0.0|platform-tools" || true

      - name: Load release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Every APK must be signed with the SAME permanent key, otherwise
          # employees cannot update the app ("App not installed").
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          KS="$RUNNER_TEMP/smhrms-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          echo "SMHRMS_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "SMHRMS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SMHRMS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SMHRMS_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"

      - name: Load Firebase config (push notifications)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing. Firebase Console → Project settings → Your apps → Android (in.systemmaster.hrms) → download google-services.json, then paste its whole content as the GOOGLE_SERVICES_JSON secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          if ! grep -q '"in.systemmaster.hrms"' android-app/app/google-services.json; then
            echo "::error::google-services.json is not for package in.systemmaster.hrms. Add an Android app with exactly that package name in Firebase and download the file again."
            exit 1
          fi
          echo "google-services.json written."

      - name: Clean Android build
        working-directory: android-app
        run: |
          gradle clean

      - name: Build fresh APK
        working-directory: android-app
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            find android-app/app/build/outputs -maxdepth 6 -type f || true
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

          # APK/ZIP files must begin with PK.
          MAGIC="$(xxd -p -l 2 "$APK")"
          if [ "$MAGIC" != "504b" ]; then
            echo "Generated file is not a valid APK/ZIP. Magic=$MAGIC"
            exit 1
          fi

      - name: Verify modern Android target
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/release/app-release.apk"

          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$AAPT" ]; then
            echo "aapt not found; APK exists but target verification cannot run."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -E "package:|sdkVersion|targetSdkVersion"

          TARGET="$(echo "$BADGING" | sed -n "s/.*targetSdkVersion:'\([^']*\)'.*/\1/p" | head -n 1)"

          if [ "$TARGET" != "36" ]; then
            echo "Expected targetSdkVersion 36, got: $TARGET"
            exit 1
          fi

          echo "Verified targetSdkVersion 36."

      - name: Verify Play Store AAB exists
        shell: bash
        run: |
          AAB="android-app/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "AAB was not generated."
            find android-app/app/build/outputs -maxdepth 6 -type f || true
            exit 1
          fi
          cp "$AAB" SM-HRMS-PlayStore.aab
          ls -lh SM-HRMS-PlayStore.aab

      - name: Show signing certificate (for assetlinks.json)
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          # apksigner exits non-zero when signature verification fails.
          # Do not grep certificate output because its wording differs across
          # Android build-tools versions (for example "V2 Signer: certificate").
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/certs.txt
          echo "APK signature verified successfully."
          echo "Put the SHA-256 digest above (with colons) into public/.well-known/assetlinks.json"

      - name: Prepare direct-download APK
        shell: bash
        run: |
          mkdir -p public/downloads
          cp android-app/app/build/outputs/apk/release/app-release.apk public/downloads/SM-HRMS.apk
          cp public/downloads/SM-HRMS.apk SM-HRMS.apk

          echo "Direct-download APK:"
          ls -lh public/downloads/SM-HRMS.apk

          sha256sum public/downloads/SM-HRMS.apk | tee public/downloads/SM-HRMS.apk.sha256

      - name: Publish APK into website repository
        shell: bash
        run: |
          git config user.name "SM HRMS Android Builder"
          git config user.email "actions@users.noreply.github.com"

          git add -f public/downloads/SM-HRMS.apk public/downloads/SM-HRMS.apk.sha256

          if git diff --cached --quiet; then
            echo "APK unchanged; no repository commit required."
          else
            git commit -m "Publish latest SM HRMS Android APK [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Create GitHub Release copy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" SM-HRMS.apk \
            --title "SM HRMS Android ${GITHUB_RUN_NUMBER}" \
            --notes "Native SM HRMS Android APK. Primary direct download: https://hrms.systemmaster.in/download/android" \
            --latest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-HRMS-APK
          path: SM-HRMS.apk
          if-no-files-found: error

      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-HRMS-PlayStore-AAB
          path: SM-HRMS-PlayStore.aab
          if-no-files-found: error
