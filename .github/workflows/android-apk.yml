name: Build & Publish Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sm-hrms-android-build
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ensure Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Build installable APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Prepare direct-download APK
        run: |
          mkdir -p public/downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk public/downloads/SM-HRMS.apk
          cp public/downloads/SM-HRMS.apk SM-HRMS.apk

      - name: Publish APK into website
        run: |
          git config user.name "SM HRMS Android Builder"
          git config user.email "actions@users.noreply.github.com"
          git add public/downloads/SM-HRMS.apk
          if git diff --cached --quiet; then
            echo "APK unchanged."
          else
            git commit -m "Publish latest SM HRMS Android APK [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Create GitHub Release copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" SM-HRMS.apk \
            --title "SM HRMS Android ${GITHUB_RUN_NUMBER}" \
            --notes "Direct-install Android build. Primary download: https://hrms.systemmaster.in/download/android" \
            --latest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-HRMS-APK
          path: SM-HRMS.apk
