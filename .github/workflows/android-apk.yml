name: Build & Publish Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sm-hrms-android-build
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK environment variable is not set."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            echo "Available SDK directories:"
            find "$SDK_ROOT" -maxdepth 3 -type d | head -n 100
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Android SDK 35
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

          echo "Installed Android packages:"
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|platform-tools" || true

      - name: Clean Android build
        working-directory: android-app
        run: |
          gradle clean

      - name: Build fresh APK
        working-directory: android-app
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            find android-app/app/build/outputs -maxdepth 6 -type f || true
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

          # APK/ZIP files must begin with PK.
          MAGIC="$(xxd -p -l 2 "$APK")"
          if [ "$MAGIC" != "504b" ]; then
            echo "Generated file is not a valid APK/ZIP. Magic=$MAGIC"
            exit 1
          fi

      - name: Verify modern Android target
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$AAPT" ]; then
            echo "aapt not found; APK exists but target verification cannot run."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -E "package:|sdkVersion|targetSdkVersion"

          TARGET="$(echo "$BADGING" | sed -n "s/.*targetSdkVersion:'\([^']*\)'.*/\1/p" | head -n 1)"

          if [ "$TARGET" != "35" ]; then
            echo "Expected targetSdkVersion 35, got: $TARGET"
            exit 1
          fi

          echo "Verified targetSdkVersion 35."

      - name: Prepare direct-download APK
        shell: bash
        run: |
          mkdir -p public/downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk public/downloads/SM-HRMS.apk
          cp public/downloads/SM-HRMS.apk SM-HRMS.apk

          echo "Direct-download APK:"
          ls -lh public/downloads/SM-HRMS.apk

          sha256sum public/downloads/SM-HRMS.apk | tee public/downloads/SM-HRMS.apk.sha256

      - name: Publish APK into website repository
        shell: bash
        run: |
          git config user.name "SM HRMS Android Builder"
          git config user.email "actions@users.noreply.github.com"

          git add -f public/downloads/SM-HRMS.apk public/downloads/SM-HRMS.apk.sha256

          if git diff --cached --quiet; then
            echo "APK unchanged; no repository commit required."
          else
            git commit -m "Publish latest SM HRMS Android APK [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Create GitHub Release copy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" SM-HRMS.apk \
            --title "SM HRMS Android ${GITHUB_RUN_NUMBER}" \
            --notes "Native SM HRMS Android APK. Primary direct download: https://hrms.systemmaster.in/download/android" \
            --latest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-HRMS-APK
          path: SM-HRMS.apk
          if-no-files-found: error
