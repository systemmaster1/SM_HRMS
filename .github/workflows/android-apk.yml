name: Build & Publish Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sm-hrms-android-build
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Build fresh APK
        working-directory: android-app
        run: |
          rm -rf app/build
          gradle clean assembleDebug --stacktrace

      - name: Verify modern Android target
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$(aapt dump badging "$APK")"
          echo "$BADGING" | grep "package: name='in.systemmaster.hrms'"
          echo "$BADGING" | grep "targetSdkVersion:'35'"
          echo "$BADGING" | grep "versionName='1.2.0'"
          sha256sum "$APK"

      - name: Prepare website download
        run: |
          mkdir -p public/downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk public/downloads/SM-HRMS.apk
          cp public/downloads/SM-HRMS.apk SM-HRMS.apk
          SHA=$(sha256sum SM-HRMS.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s SM-HRMS.apk)
          printf '{"version":"1.2.0","versionCode":3,"targetSdk":35,"sha256":"%s","size":%s,"builtAt":"%s"}\n' "$SHA" "$SIZE" "$(date -u +%FT%TZ)" > public/downloads/android-build.json

      - name: Publish fresh APK into website
        run: |
          git config user.name "SM HRMS Android Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -f public/downloads/SM-HRMS.apk public/downloads/android-build.json
          if git diff --cached --quiet; then
            echo "APK unchanged."
          else
            git commit -m "Publish SM HRMS Android v1.2.0 target SDK 35 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Create GitHub Release copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.2.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" SM-HRMS.apk public/downloads/android-build.json \
            --title "SM HRMS Android v1.2.0 (${GITHUB_RUN_NUMBER})" \
            --notes "Android target SDK 35. Duty-time foreground location tracking build." \
            --latest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-HRMS-Android-v1.2.0
          path: |
            SM-HRMS.apk
            public/downloads/android-build.json
